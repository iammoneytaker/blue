<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blue Communications - Performance Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body { font-family: 'Pretendard', sans-serif; letter-spacing: -0.02em; }
        [x-cloak] { display: none !important; }
        .card-active:hover { transform: translateY(-8px); border-color: #2563eb; box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1); }
    </style>
</head>
<body class="bg-white text-slate-900" x-data="portfolioApp()">

    <section class="pt-24 pb-20 px-6 text-center">
        <p class="text-blue-600 font-bold text-sm mb-4 tracking-widest">Results-driven performance</p>
        <h1 class="text-4xl md:text-5xl font-black mb-2 leading-tight">마케팅, 누구나 합니다.</h1>
        <h2 class="text-4xl md:text-5xl font-black mb-10 leading-tight">하지만 <span class="text-blue-600">'성과'</span>는 아무나 못 냅니다.</h2>
        
        <div class="max-w-3xl mx-auto mb-16">
            <p class="text-slate-500 font-medium mb-6 leading-relaxed">
                우리는 '브랜딩'이라는 말로 책임을 회피하지 않습니다.<br>
                매출, 전환, 유입, 재방문, 고객문의 숫자로 증명되는 결과를 위해, 끝까지 뛰는 팀.
            </p>
            <div class="inline-flex items-center gap-2 px-5 py-2.5 bg-blue-50 rounded-full border border-blue-100 shadow-sm">
                <span class="relative flex h-2 w-2">
                    <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-blue-400 opacity-75"></span>
                    <span class="relative inline-flex rounded-full h-2 w-2 bg-blue-600"></span>
                </span>
                <span class="text-xs font-bold text-blue-700 underline underline-offset-4 cursor-default">각 지표를 클릭하여 상세 성과 사례를 확인하세요.</span>
            </div>
        </div>

        <div class="max-w-6xl mx-auto grid grid-cols-2 lg:grid-cols-4 gap-6">
            <template x-for="item in cases" :key="item.id">
                <button @click="openModal(item)" 
                        class="card-active bg-white p-8 rounded-[2.5rem] border border-slate-100 shadow-sm transition-all text-center group relative overflow-hidden flex flex-col items-center">
                    <div class="w-14 h-14 bg-slate-50 rounded-2xl flex items-center justify-center mx-auto mb-6 group-hover:bg-blue-600 transition-colors">
                        <svg class="w-7 h-7 text-blue-600 group-hover:text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24" x-html="item.icon"></svg>
                    </div>
                    <h3 class="text-lg font-black mb-2 group-hover:text-blue-600 transition-colors" x-text="item.label"></h3>
                    <p class="text-[11px] text-slate-400 font-medium mb-4" x-text="item.subLabel"></p>
                    <div class="pt-4 border-t border-slate-50 mb-6">
                        <span class="text-sm font-black text-blue-600 italic" x-text="item.preview"></span>
                    </div>

                    <div class="mt-auto w-full py-3 rounded-xl bg-slate-50 text-slate-500 text-[11px] font-bold border border-slate-100 group-hover:bg-blue-600 group-hover:text-white group-hover:border-blue-600 transition-all flex items-center justify-center gap-2">
                        성공 사례 확인하기
                        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                    </div>
                </button>
            </template>
        </div>
    </section>

    <div x-show="isOpen" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/80 backdrop-blur-sm" x-cloak x-transition>
        <div class="bg-white w-full max-w-6xl rounded-[3rem] shadow-2xl overflow-hidden max-h-[95vh] overflow-y-auto relative" @click.away="closeModal()">
            <button @click="closeModal()" class="absolute top-8 right-8 text-slate-400 hover:text-slate-900 z-10 p-2 bg-slate-100 rounded-full transition-colors">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
            <div class="p-10 lg:p-16">
                <div class="flex flex-col lg:flex-row lg:items-end justify-between gap-6 mb-12 border-b border-slate-100 pb-10">
                    <div>
                        <span class="text-blue-600 font-black text-sm uppercase tracking-widest mb-3 block" x-text="currentCase?.label + ' PERFORMANCE CASE'"></span>
                        <h3 class="text-2xl md:text-4xl font-black text-slate-900 leading-tight" x-text="currentCase?.caseTitle"></h3>
                    </div>
                    <div class="bg-blue-600 text-white px-8 py-5 rounded-[1.5rem] font-black text-2xl shadow-xl shadow-blue-200" x-text="currentCase?.highlight"></div>
                </div>
                <div class="grid lg:grid-cols-2 gap-16">
                    <div>
                        <table class="w-full text-sm border-t-2 border-slate-900">
                            <tr class="border-b border-slate-100">
                                <td class="bg-slate-50 p-5 font-bold text-slate-700 w-32 text-center">업종</td>
                                <td class="p-5 font-medium text-slate-900" x-text="currentCase?.industry"></td>
                            </tr>
                            <tr class="border-b border-slate-100">
                                <td class="bg-slate-50 p-5 font-bold text-slate-700 text-center">진행기간</td>
                                <td class="p-5 text-slate-600 font-medium" x-text="currentCase?.period"></td>
                            </tr>
                            <tr class="border-b border-slate-100">
                                <td class="bg-slate-50 p-5 font-bold text-slate-700 text-center align-middle">문제상황</td>
                                <td class="p-5 text-slate-500 leading-relaxed text-xs" x-text="currentCase?.problem"></td>
                            </tr>
                            <tr class="border-b border-slate-100">
                                <td class="bg-slate-50 p-5 font-bold text-slate-700 text-center align-middle">진행업무</td>
                                <td class="p-5 text-slate-600">
                                    <ul class="list-disc pl-5 space-y-2 text-xs font-medium">
                                        <template x-for="task in currentCase?.tasks">
                                            <li x-text="task"></li>
                                        </template>
                                    </ul>
                                </td>
                            </tr>
                            <tr class="bg-slate-900">
                                <td class="p-5 font-bold text-white text-center">KPI</td>
                                <td class="p-5 font-black text-blue-400" x-text="currentCase?.kpi"></td>
                            </tr>
                        </table>
                    </div>
                    <div class="bg-slate-50 p-10 rounded-[3rem] border border-slate-100">
                        <div class="grid grid-cols-3 gap-8 h-64 items-end">
                            <template x-for="chart in currentCase?.chartData">
                                <div class="flex flex-col items-center flex-1 h-full justify-end">
                                    <div class="w-full flex items-end justify-center gap-2 mb-4 h-40">
                                        <div class="w-8 bg-slate-200 rounded-t-lg transition-all duration-1000" :style="`height: ${chart.beforeH}%`" x-show="isChartVisible"></div>
                                        <div class="w-8 bg-blue-600 rounded-t-lg transition-all duration-1000 delay-300" :style="`height: ${chart.afterH}%`" x-show="isChartVisible"></div>
                                    </div>
                                    <div class="text-center">
                                        <p class="text-[10px] text-slate-400 font-bold mb-1" x-text="chart.beforeVal"></p>
                                        <div :class="chart.isUp ? 'text-red-500' : 'text-blue-600'" class="text-xs font-black mb-2 flex items-center justify-center gap-0.5">
                                            <span x-text="chart.isUp ? '▲' : '▼'"></span>
                                            <span x-text="chart.afterVal"></span>
                                        </div>
                                        <p class="text-[11px] font-black text-slate-600 uppercase" x-text="chart.label"></p>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function portfolioApp() {
            return {
                isOpen: false,
                isChartVisible: false,
                currentCase: null,
                cases: [
                    {
                        id: 'sales', label: '매출', subLabel: '실질적인 매출 증대', preview: 'ROAS 820% 달성',
                        icon: '<path d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"></path>',
                        caseTitle: 'E-커머스 D 브랜드 매출 최적화 전략', highlight: 'ROAS 820% 달성', industry: '의류 쇼핑몰', period: '2023.10 ~ 현재',
                        problem: '고단가 품목의 낮은 전환율 및 광고비 효율 저하', kpi: 'ROAS 700% 이상 / 월 매출 2억',
                        tasks: ['리타겟팅 오디언스 세분화', '랜딩 페이지 전환 동선 개선', '고효율 상품 예산 집중 배치'],
                        chartData: [
                            { label: 'ROAS', beforeVal: '320%', afterVal: '820%', beforeH: 40, afterH: 100, isUp: true },
                            { label: '매출', beforeVal: '0.5억', afterVal: '2.1억', beforeH: 25, afterH: 95, isUp: true },
                            { label: 'CVR', beforeVal: '0.8%', afterVal: '2.4%', beforeH: 30, afterH: 90, isUp: true }
                        ]
                    },
                    {
                        id: 'cvr', label: '전환', subLabel: '높은 전환율 달성', preview: '전환율 2.4배 상승',
                        icon: '<path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>',
                        caseTitle: '뷰티 S 브랜드 CVR 극대화 프로젝트', highlight: '전환율 3.1% 달성', industry: '코스메틱', period: '2024.01 ~ 2024.06',
                        problem: '높은 유입 대비 낮은 상세페이지 구매 전환율', kpi: 'CVR 1.2% → 3.0% 목표',
                        tasks: ['상세페이지 A/B 테스트', '구매 여정 단축 및 결제 허들 제거', '고객 리뷰 기반 신뢰 콘텐츠 강화'],
                        chartData: [
                            { label: 'CVR', beforeVal: '1.3%', afterVal: '3.1%', beforeH: 42, afterH: 100, isUp: true },
                            { label: 'CPC', beforeVal: '800원', afterVal: '420원', beforeH: 95, afterH: 50, isUp: false },
                            { label: '이탈률', beforeVal: '78%', afterVal: '45%', beforeH: 90, afterH: 52, isUp: false }
                        ]
                    },
                    {
                        id: 'traffic', label: '유입', subLabel: '타겟 고객 유입 확대', preview: 'CPC 45% 절감',
                        icon: '<path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>',
                        caseTitle: '라이프스타일 브랜드 타겟 유입 최적화', highlight: 'CPC 45% 절감', industry: '인테리어 소품', period: '2023.12 ~ 현재',
                        problem: '범용 키워드 사용으로 인한 타겟 불일치 및 비용 낭비', kpi: 'CPC 300원 이하 / 방문자 3배 증가',
                        tasks: ['구매 고객 페르소나 정밀 타겟팅', '관여도 기반 키워드 믹스 재구성', '메타/GFA 채널 최적화'],
                        chartData: [
                            { label: 'CPC', beforeVal: '620원', afterVal: '280원', beforeH: 100, afterH: 45, isUp: false },
                            { label: '유입량', beforeVal: '1.2만', afterVal: '4.5만', beforeH: 27, afterH: 100, isUp: true },
                            { label: 'CTR', beforeVal: '0.8%', afterVal: '2.4%', beforeH: 33, afterH: 100, isUp: true }
                        ]
                    },
                    {
                        id: 'inquiry', label: '문의', subLabel: '실질적인 상담 증가', preview: 'DB 유입 3.5배 증가',
                        icon: '<path d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path>',
                        caseTitle: 'P 치킨 브랜드 가맹 상담 DB 최적화', highlight: 'ROAS 470% 증가', industry: 'P 치킨 프랜차이즈', period: '2023.07 ~ 현재',
                        problem: '구분되지 않는 캠페인 운영 및 타겟팅 부재로 인한 DB 단가 상승', 
                        kpi: '월 DB 500개 이상 / CPA 3만원 이하',
                        tasks: ['지역/시간대별 정밀 타겟팅 설정', '매체 특성에 맞는 신규 소재 제작', 'DB 유입 경로 최적화 및 누수 차단'],
                        chartData: [
                            { label: 'CVR', beforeVal: '1.04%', afterVal: '3.58%', beforeH: 29, afterH: 100, isUp: true },
                            { label: 'CPA', beforeVal: '3.2만', afterVal: '1.9만', beforeH: 100, afterH: 60, isUp: false },
                            { label: 'Monthly DB', beforeVal: '210건', afterVal: '737건', beforeH: 28, afterH: 100, isUp: true }
                        ]
                    }
                ],
                openModal(item) {
                    this.currentCase = item;
                    this.isOpen = true;
                    setTimeout(() => {
                        this.isChartVisible = true;
                    }, 300);
                },
                closeModal() {
                    this.isOpen = false;
                    this.isChartVisible = false;
                }
            }
        }
    </script>
</body>
</html>
