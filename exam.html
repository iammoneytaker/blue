<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>블루컴즈 서비스 템플릿</title>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .blue-gradient { background: linear-gradient(135deg, #002B5B 0%, #1d4ed8 100%); }
    </style>
</head>
<body class="bg-[#f8fafc] text-slate-900 font-sans">

    <section class="blue-gradient text-white p-8 pt-16 pb-20">
        <div class="max-w-md mx-auto">
            <p class="text-blue-300 text-[10px] font-bold tracking-[0.2em] mb-2 uppercase">Service Details</p>
            <h1 class="text-2xl font-black leading-tight mb-4">
                성과는 설계되고,<br>전환으로 증명됩니다.
            </h1>
            <p class="text-xs text-blue-100 opacity-80 leading-relaxed">
                블루컴즈는 단순 노출이 아닌 '실제 액션'을 설계합니다.
            </p>
        </div>
    </section>

    <section class="px-6 -mt-10 mb-10">
        <div class="max-w-md mx-auto bg-white p-8 rounded-2xl shadow-xl border border-slate-100 text-center">
            <p class="text-[10px] text-blue-600 font-bold mb-2 uppercase tracking-widest">Core Logic</p>
            <h3 class="text-lg font-black text-slate-800 mb-4">
                퍼포먼스 광고 =<br>
                <span class="text-xl text-blue-600 italic">클릭 × 랜딩 × 콘텐츠</span>의 조합
            </h3>
            <p class="text-[11px] text-slate-500 leading-relaxed">
                광고 유입부터 액션 발생까지 완성된 퍼널 구조를 운영합니다.
            </p>
        </div>
    </section>

    <section class="px-6 mb-12">
        <div class="max-w-md mx-auto">
            <h2 class="text-lg font-black mb-6 flex items-center gap-2">
                <span class="w-1 h-5 bg-blue-600 rounded-full"></span>
                서비스 영역
            </h2>
            <div class="grid grid-cols-2 gap-3">
                <div class="bg-white p-5 rounded-xl border border-slate-100 shadow-sm flex flex-col items-center text-center">
                    <div class="w-10 h-10 bg-blue-50 text-blue-600 rounded-lg flex items-center justify-center mb-3">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M4 5a1 1 0 011-1h14a1 1 0 011 1v12a1 1 0 01-1 1H5a1 1 0 01-1-1V5z"></path></svg>
                    </div>
                    <h4 class="font-bold text-[13px] mb-1">네이버 검색광고</h4>
                    <p class="text-[10px] text-slate-400">의도 기반 고객 선점</p>
                </div>
                </div>
        </div>
    </section>

    <section class="bg-slate-900 text-white py-12 mb-12 overflow-hidden">
        <div class="max-w-md mx-auto px-6">
            <h2 class="text-lg font-black mb-6">성과 중심의 실행 강점</h2>
            <div class="flex overflow-x-auto no-scrollbar gap-4">
                <div class="min-w-[80%] bg-white/5 border border-white/10 p-6 rounded-2xl">
                    <h4 class="font-bold text-blue-400 mb-2">01. 성과 중심 설계</h4>
                    <p class="text-[12px] text-slate-400 leading-relaxed">
                        무드보다 구조를 먼저 설계하여 최적화된 결과물을 만듭니다.
                    </p>
                </div>
                </div>
        </div>
    </section>

    <div class="fixed bottom-6 left-6 right-6 z-50">
        <button class="w-full blue-gradient text-white py-4 rounded-xl font-black shadow-2xl active:scale-95 transition-all">
            지금 바로 문의하기
        </button>
    </div>

</body>
</html>
